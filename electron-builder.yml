# Packaging (docs/release-plan.md, architecture.md §Platform Strategy): native builds on each OS, no compatibility layer.
appId: org.paroh.app
productName: Paroh
copyright: Copyright © 2026 Paroh contributors
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
# Journal data never ships inside the app; only the compiled app does.
asar: true
linux:
  target:
    - deb
    - AppImage
  category: Office
  icon: build/icon.png
  maintainer: pankqx <pankqx@users.noreply.github.com>
  synopsis: An offline-first journal that keeps your writing as plain files
  description: Paroh is a calm, local-first journal. Every day is a plain Markdown file in a folder you own.
  syncDesktopName: true
  artifactName: ${productName}-${version}-${arch}.${ext}
  desktop:
    entry:
      StartupWMClass: Paroh
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
publish: null
