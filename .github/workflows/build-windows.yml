name: Build Windows

# Added from Roadmap Phase 7 onward. Runs on a real Windows GitHub Actions runner —
# this is the CI-based Windows build referenced in docs/architecture.md's Platform
# Strategy, which explicitly avoids Wine on the Ubuntu dev machine entirely.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect Node application foundation
        id: detect
        shell: bash
        run: |
          if [[ -f package.json ]] && [[ -f package-lock.json ]]; then
            echo "has_app_foundation=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_app_foundation=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip Node/Electron checks for documentation-only phase
        if: steps.detect.outputs.has_app_foundation != 'true'
        run: echo "Documentation-only repository detected; skipping Node/Electron checks until package.json and package-lock.json exist."
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.has_app_foundation == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.detect.outputs.has_app_foundation == 'true'
      - run: npm run build:windows
        if: steps.detect.outputs.has_app_foundation == 'true'
      - uses: actions/upload-artifact@v4
        if: steps.detect.outputs.has_app_foundation == 'true'
        with:
          name: paroh-windows
          path: |
            dist/*.exe
            dist/*.exe.blockmap
